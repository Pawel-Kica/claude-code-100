<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>__TITLE__</title>
<style>
:root{--bg:#F6F2EA;--card:#fff;--ink:#14130f;--muted:#75726a;--line:#e2ddd2;--accent:#C8553D;
--serif:"Iowan Old Style",Georgia,serif;--sans:-apple-system,"Inter",Helvetica,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
img,video{max-width:100%;display:block}
h1,h3{font-family:var(--serif);font-weight:600;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:34px 20px 90px}
header.run{margin-bottom:26px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
header.run h1{font-size:28px;letter-spacing:-.01em}
header.run p{margin:4px 0 0;color:var(--muted);font-size:14px}
.badge{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid #b9cbb4;background:#eef4ec;color:#3f6b39;border-radius:999px;padding:5px 12px;white-space:nowrap}
.badge.warn{border-color:#e3c4b8;background:#fbeee9;color:#9c4a30}
video{width:100%;max-height:58vh;object-fit:contain;background:#000;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 2px}
.chips button{flex:0 0 auto;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 13px;cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips .t{font-variant-numeric:tabular-nums;opacity:.6;margin-left:6px}
.frame{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}
.stage{position:relative;background:#fff}
.stage img{width:100%;max-height:76vh;object-fit:contain;background:#fff;cursor:zoom-in}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
.arrow:hover{background:#fff;border-color:#c8c2b4}
.arrow.l{left:14px}.arrow.r{right:14px}
.cap{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
.cap .num{font-family:var(--serif);color:var(--accent);font-size:15px;min-width:26px}
.cap h3{font-size:16px}
.cap p{margin:3px 0 0;color:var(--muted);font-size:14px}
.cap .tc{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cap .tc a{color:var(--accent);text-decoration:none;border-bottom:1px solid #e6c5bc}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;padding:16px 2px 4px}
.thumbs button{flex:0 0 150px;padding:0;border:1px solid var(--line);background:var(--card);border-radius:9px;overflow:hidden;cursor:pointer;opacity:.62}
.thumbs button.on{opacity:1;border-color:var(--ink)}
.thumbs img{width:100%;aspect-ratio:16/10;object-fit:cover}
.thumbs span{display:block;font-size:11px;color:var(--muted);padding:5px 7px;text-align:left}
.flag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#9c4a30;background:#fbeee9;border:1px solid #e3c4b8;border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:2px}
#lightbox{position:fixed;inset:0;background:rgba(20,19,15,.9);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out;padding:30px}
#lightbox img{max-height:92vh;border-radius:8px}
</style></head><body>
<div class="wrap">
  <header class="run"><div><h1>__TITLE__</h1><p>__SUB__</p></div><span class="badge" id="badge">__VERDICT__</span></header>
  <video id="v" controls playsinline></video>
  <div class="chips" id="chips"></div>
  <div class="frame"><div class="stage"><img id="stage"><button class="arrow l">‹</button><button class="arrow r">›</button></div>
    <div class="cap"><span class="num"></span><div><h3></h3><p></p></div><span class="tc"></span></div></div>
  <div class="thumbs" id="thumbs"></div>
</div>
<div id="lightbox" onclick="this.style.display='none'"><img></div>
<script>
/* STEPS: [{n,title,caption,img,thumb,t?,flag?}]  VIDEO: data URI or "" for screenshots-only */
const STEPS = __DATA__;
const VIDEO = "__VIDEO__";

const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,'0');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const flag=s=>s.flag?`<span class="flag">${s.flag}</span>`:'';
const v=document.getElementById('v'),chips=document.getElementById('chips'),thumbs=document.getElementById('thumbs'),
      img=document.getElementById('stage'),num=document.querySelector('.num'),h3=document.querySelector('.cap h3'),
      p=document.querySelector('.cap p'),tc=document.querySelector('.tc'),lb=document.getElementById('lightbox');
const hasVideo=!!VIDEO;
if(hasVideo){v.src=VIDEO}else{v.remove();chips.remove()}
if(/fail|broke/i.test(document.getElementById('badge').textContent))document.getElementById('badge').classList.add('warn');

STEPS.forEach(s=>{
  if(hasVideo)chips.append(el(`<button>${s.n}. ${s.title}<span class="t">${fmt(s.t)}</span></button>`));
  thumbs.append(el(`<button><img src="${s.thumb}"><span>${s.n}. ${s.title}</span></button>`));
});
/* Video (chips) and stage (thumbs/arrows) are decoupled: thumbs and arrows only change
   the stage; only a chip or "play from here" seeks the video; playback only moves the chip highlight. */
let i=-1;
function show(k){
  k=(k+STEPS.length)%STEPS.length; if(k===i)return; i=k; const s=STEPS[k];
  img.src=s.img;num.textContent=s.n;h3.innerHTML=s.title+flag(s);p.textContent=s.caption;
  if(hasVideo){tc.innerHTML=`${fmt(s.t)} <a href="#">play from here</a>`;
    tc.querySelector('a').onclick=e=>{e.preventDefault();v.currentTime=s.t;v.play();v.scrollIntoView({behavior:'smooth',block:'start'})};}
  [...thumbs.children].forEach((b,j)=>b.classList.toggle('on',j===k));
}
[...chips.children].forEach((b,j)=>b.onclick=()=>{v.currentTime=STEPS[j].t;v.play()});
[...thumbs.children].forEach((b,j)=>b.onclick=()=>show(j));
document.querySelector('.arrow.l').onclick=()=>show(i-1);
document.querySelector('.arrow.r').onclick=()=>show(i+1);
document.onkeydown=e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)};
img.onclick=()=>{lb.querySelector('img').src=STEPS[i].img;lb.style.display='flex'};
if(hasVideo)v.ontimeupdate=()=>{let k=0;STEPS.forEach((s,j)=>{if(v.currentTime>=s.t)k=j});
  [...chips.children].forEach((b,j)=>b.classList.toggle('on',j===k))};
show(0);
</script></body></html>
